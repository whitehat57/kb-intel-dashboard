<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KB Intel Dashboard - Cybersecurity Intelligence</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e14;--card:#131820;--border:#1e2833;--accent:#00d4aa;--accent2:#0e84e8;--warn:#f0b429;--danger:#e8484c;--text:#c9d1d9;--muted:#7d8590;--bright:#e6edf3}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1600px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:24px}
h1{font-size:24px;color:var(--bright);display:flex;align-items:center;gap:10px}
h1 .icon{color:var(--accent);font-size:28px}
.timestamp{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 20px;background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);transition:all .2s;user-select:none}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;text-align:center}
.stat-num{font-size:32px;font-weight:700;color:var(--accent)}
.stat-num.blue{color:var(--accent2)}.stat-num.warn{color:var(--warn)}.stat-num.danger{color:var(--danger)}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.charts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:24px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px}
.chart-title{font-size:14px;font-weight:600;color:var(--bright);margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.bar-label{width:140px;text-align:right;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:var(--bg);border-radius:4px;height:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));min-width:2px;transition:width .3s}
.bar-val{width:40px;font-size:12px;color:var(--text)}
.search-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none}
.search-input:focus{border-color:var(--accent)}
.filter-select{padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);padding:10px 12px;text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--text)}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover td{background:rgba(0,212,170,.03)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-israeli{background:rgba(232,72,76,.15);color:#e8484c}
.badge-supporter{background:rgba(240,180,41,.15);color:#f0b429}
.badge-enriched{background:rgba(0,212,170,.15);color:#00d4aa}
.badge-unknown{background:rgba(125,133,144,.15);color:#7d8590}
.badge-tag{background:rgba(14,132,232,.12);color:#58a6ff;margin:1px}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
.detail-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:20px;display:none}
.detail-panel.show{display:block}
.detail-close{float:right;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.detail-close:hover{border-color:var(--danger);color:var(--danger)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.detail-section h3{font-size:14px;color:var(--accent);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px}
.detail-section .kv{display:flex;gap:8px;margin-bottom:4px;font-size:13px}
.detail-section .k{color:var(--muted);min-width:100px}
.detail-section .v{color:var(--text);word-break:break-all}
.subdomain-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.subdomain-list span{background:var(--bg);padding:2px 8px;border-radius:4px;font-size:11px;color:var(--accent2)}
.repo-item{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid var(--border)}
.pagination{display:flex;justify-content:center;gap:4px;margin-top:16px;flex-wrap:wrap}
.page-btn{padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;font-size:13px}
.page-btn:hover{border-color:var(--accent)}
.page-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.entity-type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.entity-type-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;cursor:pointer}
.entity-type-card:hover{border-color:var(--accent)}
.entity-type-card .num{font-size:24px;font-weight:700;color:var(--accent2)}
.entity-type-card .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.fts-result{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer}
.fts-result:hover{border-color:var(--accent)}
.fts-result .title{font-weight:600;color:var(--bright);margin-bottom:4px}
.fts-result .snippet{font-size:12px;color:var(--muted);line-height:1.4}
.fts-result mark{background:rgba(0,212,170,.25);color:var(--accent);padding:0 2px;border-radius:2px}
.view-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.view-name{font-weight:600;color:var(--accent);font-size:14px}
.view-role{font-size:12px;color:var(--muted)}
.view-desc{font-size:13px;margin-top:4px}
.view-sql{font-family:monospace;font-size:12px;background:var(--bg);padding:8px;border-radius:4px;margin-top:8px;color:var(--muted);white-space:pre-wrap;word-break:break-all}
.empty{text-align:center;padding:40px;color:var(--muted)}
.loading{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:768px){.detail-grid{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<header>
<h1><span class="icon">&#9678;</span>KB Intel Dashboard</h1>
<span class="timestamp" id="ts">Loading...</span>
</header>
<div class="tabs">
<div class="tab active" onclick="switchTab('overview')">Overview</div>
<div class="tab" onclick="switchTab('companies')">Companies</div>
<div class="tab" onclick="switchTab('entities')">Entities</div>
<div class="tab" onclick="switchTab('search')">Search</div>
<div class="tab" onclick="switchTab('views')">Views</div>
</div>
<div id="tab-overview"><div class="loading">Loading data...</div></div>
<div id="tab-companies" style="display:none">
<div class="search-bar">
<input class="search-input" id="company-search" placeholder="Search name, domain, IP, ASN, tag..." oninput="filterCompanies()">
<select class="filter-select" id="filter-category" onchange="filterCompanies()">
<option value="">All</option><option value="israeli">Israeli</option><option value="supporter">Supporter</option><option value="enriched">Enriched</option><option value="unknown">Unknown Server</option>
</select>
<select class="filter-select" id="filter-cloud" onchange="filterCompanies()"><option value="">All Clouds</option></select>
</div>
<div class="detail-panel" id="detail-panel"><button class="detail-close" onclick="closeDetail()">Close</button><div id="detail-content"></div></div>
<table id="companies-table"><thead><tr>
<th onclick="sortBy('title')">Company</th><th onclick="sortBy('cat')">Cat</th><th onclick="sortBy('domain')">Domain</th><th onclick="sortBy('server')">Server</th><th onclick="sortBy('cloud')">Cloud</th><th onclick="sortBy('subs')">Subs</th><th onclick="sortBy('gh')">GitHub</th><th>Tags</th>
</tr></thead><tbody id="companies-tbody"></tbody></table>
<div class="pagination" id="companies-pagination"></div>
</div>
<div id="tab-entities" style="display:none">
<div class="entity-type-grid" id="entity-type-grid"></div>
<div class="search-bar"><input class="search-input" id="entity-search" placeholder="Search entities..." oninput="filterEntities()"></div>
<table id="entities-table"><thead><tr><th>Type</th><th>Value</th><th>Context</th></tr></thead><tbody id="entities-tbody"></tbody></table>
<div class="pagination" id="entities-pagination"></div>
</div>
<div id="tab-search" style="display:none">
<div class="search-bar"><input class="search-input" id="fts-input" placeholder="Full-text search... press Enter" onkeydown="if(event.key==='Enter')runFTS()"></div>
<div id="fts-results"><div class="empty">Enter search term</div></div>
</div>
<div id="tab-views" style="display:none"><div id="views-container"></div></div>
</div>
<script>
let DOCS=[],ENTITIES=[],VIEWS=[],STATS={};
let companyPage=0,entityPage=0,sortKey='title',sortAsc=true;
const PAGE_SIZE=50;
async function init(){
try{
const [docs,ents,vws,sts]=await Promise.all([
fetch('data_documents.json').then(r=>r.json()),
fetch('data_entities.json').then(r=>r.json()),
fetch('data_views.json').then(r=>r.json()),
fetch('stats.json').then(r=>r.json())
]);
DOCS=docs;ENTITIES=ents;VIEWS=vws;STATS=sts;
document.getElementById('ts').textContent='Generated: '+new Date(STATS.generated_at).toLocaleString('id-ID')+' | '+STATS.total_documents+' docs';
renderOverview();
}catch(e){document.getElementById('tab-overview').innerHTML='<div class="empty">Error loading data: '+e.message+'</div>';}
}
function switchTab(t){
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
document.querySelector(`[onclick="switchTab('${t}')"]`).classList.add('active');
document.querySelectorAll('[id^="tab-"]').forEach(el=>el.style.display='none');
document.getElementById('tab-'+t).style.display='block';
if(t==='companies')renderCompanies();
if(t==='entities')renderEntities();
if(t==='views')renderViews();
}
function renderOverview(){
const s=STATS;
const sg=document.querySelector('#tab-overview');
sg.innerHTML=`<div class="stats-grid">
<div class="stat-card"><div class="stat-num">${s.total_documents}</div><div class="stat-label">Documents</div></div>
<div class="stat-card"><div class="stat-num danger">${s.israeli_count}</div><div class="stat-label">Israeli</div></div>
<div class="stat-card"><div class="stat-num warn">${s.total_documents-s.israeli_count}</div><div class="stat-label">Supporters</div></div>
<div class="stat-card"><div class="stat-num">${s.enriched_count}</div><div class="stat-label">Enriched</div></div>
<div class="stat-card"><div class="stat-num blue">${s.with_website}</div><div class="stat-label">With Website</div></div>
<div class="stat-card"><div class="stat-num blue">${s.total_entities}</div><div class="stat-label">Entities</div></div>
</div>
<div class="charts-row">
<div class="chart-card"><div class="chart-title">Cloud Providers</div>${bars(s.cloud_distribution)}</div>
<div class="chart-card"><div class="chart-title">Servers</div>${bars(s.server_distribution)}</div>
<div class="chart-card"><div class="chart-title">JS Frameworks</div>${bars(s.js_frameworks)}</div>
<div class="chart-card"><div class="chart-title">CDN / WAF</div>${bars(s.cdn_distribution)}</div>
<div class="chart-card"><div class="chart-title">Entity Types</div>${bars(s.entity_types)}</div>
</div>`;
}
function bars(data){
if(!data||!Object.keys(data).length)return '<div style="color:var(--muted);font-size:13px">No data</div>';
const max=Math.max(...Object.values(data),1);
return Object.entries(data).slice(0,10).map(([k,v])=>
`<div class="bar-row"><span class="bar-label">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${(v/max*100).toFixed(1)}%"></div></div><span class="bar-val">${v}</span></div>`).join('');
}
function getFiltered(){
const q=(document.getElementById('company-search').value||'').toLowerCase();
const cat=document.getElementById('filter-category').value;
const cloud=document.getElementById('filter-cloud').value;
let f=DOCS.filter(d=>{
const m=d.metadata||{},ts=m.tech_stack||{};
if(cat==='israeli'&&!d.tags.some(t=>t.toLowerCase().includes('israeli')))return false;
if(cat==='supporter'&&d.tags.some(t=>t.toLowerCase().includes('israeli')))return false;
if(cat==='enriched'&&!d.tags.includes('enriched'))return false;
if(cat==='unknown'&&ts.server&&ts.server!=='Unknown')return false;
if(cloud&&ts.cloud_provider!==cloud)return false;
if(q){const s=[d.title,m.domain,m.website,...(m.ips||[]),...(m.asn||[]),...d.tags,ts.server,ts.cloud_provider].join(' ').toLowerCase();if(!s.includes(q))return false;}
return true;
});
const dir=sortAsc?1:-1;
f.sort((a,b)=>{
const ta=a.metadata?.tech_stack||{},tb=b.metadata?.tech_stack||{};
let va,vb;
switch(sortKey){case'title':va=a.title;vb=b.title;break;case'cat':va=a.tags.some(t=>t.includes('israeli'))?0:1;vb=b.tags.some(t=>t.includes('israeli'))?0:1;break;
case'domain':va=a.metadata?.domain||'';vb=b.metadata?.domain||'';break;case'server':va=ta.server||'zzz';vb=tb.server||'zzz';break;
case'cloud':va=ta.cloud_provider||'zzz';vb=tb.cloud_provider||'zzz';break;case'subs':va=a.metadata?.subdomain_count||0;vb=b.metadata?.subdomain_count||0;break;
case'gh':va=a.metadata?.github_repo_count||0;vb=b.metadata?.github_repo_count||0;break;default:va=a.title;vb=b.title;}
if(typeof va==='number')return(va-vb)*dir;
return String(va).localeCompare(String(vb))*dir;
});
return f;
}
function renderCompanies(){
const f=getFiltered(),tp=Math.ceil(f.length/PAGE_SIZE);
if(companyPage>=tp)companyPage=0;
const page=f.slice(companyPage*PAGE_SIZE,(companyPage+1)*PAGE_SIZE);
document.getElementById('companies-tbody').innerHTML=page.map(d=>{
const m=d.metadata||{},ts=m.tech_stack||{};
const isI=d.tags.some(t=>t.toLowerCase().includes('israeli'));
const cb=isI?'<span class="badge badge-israeli">IL</span>':'<span class="badge badge-supporter">SUP</span>';
const eb=d.tags.includes('enriched')?' <span class="badge badge-enriched">E</span>':'';
const srv=ts.server||'<span class="badge badge-unknown">?</span>';
const cl=ts.cloud_provider&&ts.cloud_provider!=='Unknown'?ts.cloud_provider:'';
const dm=m.domain?`<a href="https://${m.domain}" target="_blank">${esc(m.domain)}</a>`:'<span style="color:var(--muted)">-</span>';
const tg=d.tags.filter(t=>!['israeli','enriched'].includes(t)).slice(0,3).map(t=>`<span class="badge badge-tag">${esc(t)}</span>`).join('');
return `<tr onclick="showDetail('${d.uuid}')" style="cursor:pointer"><td><strong>${esc(d.title)}</strong>${eb}</td><td>${cb}</td><td>${dm}</td><td>${srv}</td><td>${cl}</td><td>${m.subdomain_count||0}</td><td>${m.github_repo_count||0}</td><td>${tg}</td></tr>`;
}).join('');
let pg='';
if(tp>1){pg+=`<button class="page-btn" onclick="companyPage=${Math.max(0,companyPage-1)};renderCompanies()">&lsaquo;</button>`;
for(let p=Math.max(0,companyPage-2);p<=Math.min(tp-1,companyPage+2);p++)pg+=`<button class="page-btn ${p===companyPage?'active':''}" onclick="companyPage=${p};renderCompanies()">${p+1}</button>`;
pg+=`<button class="page-btn" onclick="companyPage=${Math.min(tp-1,companyPage+1)};renderCompanies()">&rsaquo;</button>`;}
document.getElementById('companies-pagination').innerHTML=pg;
const clouds=[...new Set(DOCS.map(d=>d.metadata?.tech_stack?.cloud_provider).filter(c=>c&&c!=='Unknown'))].sort();
const cf=document.getElementById('filter-cloud');
if(cf.options.length<=1)cf.innerHTML='<option value="">All Clouds</option>'+clouds.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
}
function sortBy(k){if(sortKey===k)sortAsc=!sortAsc;else{sortKey=k;sortAsc=true;}renderCompanies();}
function filterCompanies(){companyPage=0;renderCompanies();}
function showDetail(uuid){
const d=DOCS.find(x=>x.uuid===uuid);if(!d)return;
const m=d.metadata||{},ts=m.tech_stack||{},dns=m.dns_records||{},os=m.osint_findings||{};
document.getElementById('detail-content').innerHTML=`
<h2 style="color:var(--bright);margin-bottom:8px">${esc(d.title)}</h2>
<div>${d.tags.map(t=>`<span class="badge badge-tag">${esc(t)}</span>`).join(' ')}</div>
<div class="detail-grid">
<div class="detail-section"><h3>General</h3>
<div class="kv"><span class="k">Category:</span><span class="v">${d.tags.some(t=>t.includes('israeli'))?'Israeli':'Supporter'}</span></div>
<div class="kv"><span class="k">Website:</span><span class="v">${m.website?`<a href="${m.website}" target="_blank">${esc(m.website)}</a>`:'-'}</span></div>
<div class="kv"><span class="k">Domain:</span><span class="v">${esc(m.domain||'-')}</span></div>
<div class="kv"><span class="k">Enrichment:</span><span class="v">${m.enrichment?m.enrichment.method+' (conf '+m.enrichment.confidence+')':'recon only'}</span></div>
</div>
<div class="detail-section"><h3>Tech Stack</h3>
<div class="kv"><span class="k">Server:</span><span class="v">${esc(ts.server||'Unknown')}</span></div>
<div class="kv"><span class="k">CDN/WAF:</span><span class="v">${esc(ts.cdn||'-')}</span></div>
<div class="kv"><span class="k">Cloud:</span><span class="v">${esc(ts.cloud_provider||'-')}</span></div>
<div class="kv"><span class="k">JS Frameworks:</span><span class="v">${(ts.js_frameworks||[]).join(', ')||'-'}</span></div>
<div class="kv"><span class="k">SSL:</span><span class="v">${ts.ssl_expiry?esc(ts.ssl_expiry):'-'}</span></div>
</div>
<div class="detail-section"><h3>Network</h3>
<div class="kv"><span class="k">IPs:</span><span class="v">${(m.ips||[]).join('<br>')||'-'}</span></div>
<div class="kv"><span class="k">ASN:</span><span class="v">${(m.asn||[]).join('<br>')||'-'}</span></div>
<div class="kv"><span class="k">MX:</span><span class="v">${(dns.MX||[]).join('<br>')||'-'}</span></div>
<div class="kv"><span class="k">NS:</span><span class="v">${(dns.NS||[]).join('<br>')||'-'}</span></div>
</div>
<div class="detail-section"><h3>GitHub (${m.github_repo_count||0})</h3>
${(os.github_ecosystem||[]).slice(0,5).map(r=>`<div class="repo-item"><span>${esc(r.repo||'')}</span><span style="color:var(--warn)">${r.stars||0} &#9733;</span></div>`).join('')||'<span style="color:var(--muted)">None</span>'}
</div></div>
${os.ai_adoption?`<div class="detail-section" style="margin-top:12px"><h3>AI Adoption</h3>${os.ai_adoption.map(a=>`<p style="font-size:13px">${esc(a)}</p>`).join('')}</div>`:''}
${os.status?`<div class="detail-section" style="margin-top:12px"><h3>Status</h3><p style="font-size:13px">${esc(os.status)}</p></div>`:''}
`;
document.getElementById('detail-panel').classList.add('show');
document.getElementById('detail-panel').scrollIntoView({behavior:'smooth'});
}
function closeDetail(){document.getElementById('detail-panel').classList.remove('show');}
function renderEntities(){
const q=(document.getElementById('entity-search').value||'').toLowerCase();
document.getElementById('entity-type-grid').innerHTML=Object.entries(STATS.entity_types).map(([t,c])=>
`<div class="entity-type-card" onclick="document.getElementById('entity-search').value='${t}:';filterEntities()"><div class="num">${c}</div><div class="lbl">${esc(t)}</div></div>`).join('');
let f=ENTITIES;
if(q)f=ENTITIES.filter(e=>(e.entity_type+' '+e.entity_value+' '+(e.context||'')).toLowerCase().includes(q));
const tp=Math.ceil(f.length/PAGE_SIZE);if(entityPage>=tp)entityPage=0;
const page=f.slice(entityPage*PAGE_SIZE,(entityPage+1)*PAGE_SIZE);
document.getElementById('entities-tbody').innerHTML=page.map(e=>
`<tr><td><span class="badge badge-tag">${esc(e.entity_type)}</span></td><td>${esc(e.entity_value)}</td><td>${esc((e.context||'').substring(0,60))}</td></tr>`).join('');
let pg='';
if(tp>1){pg+=`<button class="page-btn" onclick="entityPage=${Math.max(0,entityPage-1)};renderEntities()">&lsaquo;</button>`;
for(let p=Math.max(0,entityPage-2);p<=Math.min(tp-1,entityPage+2);p++)pg+=`<button class="page-btn ${p===entityPage?'active':''}" onclick="entityPage=${p};renderEntities()">${p+1}</button>`;
pg+=`<button class="page-btn" onclick="entityPage=${Math.min(tp-1,entityPage+1)};renderEntities()">&rsaquo;</button>`;}
document.getElementById('entities-pagination').innerHTML=pg;
}
function filterEntities(){entityPage=0;renderEntities();}
function runFTS(){
const q=document.getElementById('fts-input').value.trim();if(!q)return;
const terms=q.toLowerCase().split(/\s+/).filter(t=>t);
const results=DOCS.filter(d=>{const text=(d.title+' '+(d.content||'')+' '+(d.tags||[]).join(' ')+' '+(d.metadata?JSON.stringify(d.metadata):'')).toLowerCase();return terms.every(t=>text.includes(t));}).slice(0,20);
const el=document.getElementById('fts-results');
if(!results.length){el.innerHTML='<div class="empty">No results</div>';return;}
el.innerHTML=results.map(d=>{
let sn='';const lc=(d.content||'').toLowerCase();let idx=lc.indexOf(terms[0]);
if(idx>=0){sn=(d.content||'').substring(Math.max(0,idx-50),idx+150);terms.forEach(t=>{sn=sn.replace(new RegExp('('+t+')','gi'),'<mark>$1</mark>');});}
else sn=(d.content||'').substring(0,150);
return `<div class="fts-result" onclick="switchTab('companies');showDetail('${d.uuid}')"><div class="title">${esc(d.title)}</div><div class="snippet">${esc(sn)}...</div></div>`;
}).join('');
}
function renderViews(){
document.getElementById('views-container').innerHTML=VIEWS.map(v=>
`<div class="view-card"><div class="view-name">${esc(v.name)}</div><div class="view-role">Role: ${esc(v.agent_role||'-')}</div><div class="view-desc">${esc(v.description||'')}</div><div class="view-sql">${esc(v.query_sql||'')}</div></div>`).join('')||'<div class="empty">No views</div>';
}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
init();
</script>
</body>
